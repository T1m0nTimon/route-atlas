name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Command line smoke test
        run: |
          node bin/route-atlas.js --version
          node bin/route-atlas.js list .
          node bin/route-atlas.js lint .

  package:
    name: Package extension
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @vscode/vsce@3 package --no-dependencies --out route-atlas.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: route-atlas-vsix
          path: route-atlas.vsix
          if-no-files-found: error
