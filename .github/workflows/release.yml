name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag and package.json agree
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm test
      - run: npx --yes @vscode/vsce@3 package --no-dependencies --out "route-atlas-${GITHUB_REF_NAME#v}.vsix"
      - name: Release notes from the changelog
        run: |
          awk -v version="## ${GITHUB_REF_NAME#v}" '
            $0 == version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          printf '\nInstall: download the .vsix below and run `code --install-extension route-atlas-%s.vsix`, or update from the Marketplace.\n' "${GITHUB_REF_NAME#v}" >> notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "route-atlas-${GITHUB_REF_NAME#v}.vsix" --title "Route Atlas ${GITHUB_REF_NAME#v}" --notes-file notes.md
      - name: Publish to the Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@3 publish --no-dependencies --packagePath "route-atlas-${GITHUB_REF_NAME#v}.vsix"
